services:
  my-store:
    image: ghcr.io/${GHCR_USERNAME:-hyunjoonkwak}/my-store:${IMAGE_TAG:-latest}
    container_name: my-store
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET}
      - SCHEDULER_SECRET=${SCHEDULER_SECRET:-}
      - SCRAPER_ALLOWED_HOSTS=${SCRAPER_ALLOWED_HOSTS:-}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:?set it in .env — secrets are stored plaintext without it}
      - COOLSMS_API_KEY=${COOLSMS_API_KEY}
      - COOLSMS_API_SECRET=${COOLSMS_API_SECRET}
      - COOLSMS_SENDER_ID=${COOLSMS_SENDER_ID}
      - KAKAO_ALIMTALK_API_KEY=${KAKAO_ALIMTALK_API_KEY}
      - KAKAO_ALIMTALK_SENDER_ID=${KAKAO_ALIMTALK_SENDER_ID}
      - KAKAO_ALIMTALK_TEMPLATE_ID=${KAKAO_ALIMTALK_TEMPLATE_ID}
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Drives automatic sync: pings the app every 5 minutes over the compose
  # network (never exposed publicly). The route itself decides which
  # schedules are actually due, so a frequent tick is cheap.
  my-store-cron:
    image: curlimages/curl:8.11.1
    container_name: my-store-cron
    restart: unless-stopped
    depends_on:
      my-store:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - TZ=Asia/Seoul
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          curl -sS -m 240 -o /dev/null \
            -H "Authorization: Bearer $$CRON_SECRET" \
            http://my-store:3000/api/cron/sync || true
        done
